[project]
name = "subdomain-takeover-scanner"
version = "0.1.0"
description = "Scans a domain's subdomains for dangling-CNAME takeover risk using a from-scratch DNS client, no third-party dependency."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "T-X" }]
dependencies = []

[project.scripts]
subdomain-takeover-scanner = "subdomain_takeover_scanner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["subdomain_takeover_scanner"]

[tool.ruff]
line-length = 100
target-version = "py39"
